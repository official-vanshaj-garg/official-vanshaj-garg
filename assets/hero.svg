    <text x="19" y="23" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">SDE INTERN</text>

    <rect x="198" y="0" width="205" height="34" rx="17" fill="#0F172A" stroke="#818CF8"/>
    <text x="217" y="23" fill="#C7D2FE" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">AI/ML UNDERGRAD</text>

    <rect x="423" y="0" width="235" height="34" rx="17" fill="#0F172A" stroke="#C084FC"/>
    <text x="442" y="23" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">BACKEND + APPLIED AI</text>
  </g>
