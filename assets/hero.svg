<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="72" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="24" fill="url(#bg)"/>

  <!-- Very subtle grid -->
  <g opacity="0.06">
    <path d="M120 0V220" stroke="#94A3B8"/>
    <path d="M240 0V220" stroke="#94A3B8"/>
    <path d="M360 0V220" stroke="#94A3B8"/>
    <path d="M480 0V220" stroke="#94A3B8"/>
    <path d="M600 0V220" stroke="#94A3B8"/>
    <path d="M720 0V220" stroke="#94A3B8"/>
    <path d="M840 0V220" stroke="#94A3B8"/>
    <path d="M960 0V220" stroke="#94A3B8"/>
    <path d="M1080 0V220" stroke="#94A3B8"/>

    <path d="M0 70H1200" stroke="#94A3B8"/>
    <path d="M0 140H1200" stroke="#94A3B8"/>
  </g>

  <!-- Accent line -->
  <rect x="72" y="54" width="64" height="4" rx="2" fill="url(#accent)"/>

  <!-- Small top label -->
  <text x="72" y="42" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">
    SOFTWARE ENGINEERING · APPLIED AI
  </text>

  <!-- Name -->
  <text x="72" y="108" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">
    Vanshaj
  </text>

  <!-- Single role line -->
  <text x="72" y="145" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">
    SDE Intern · AI/ML Undergraduate · Backend + Applied AI Builder
  </text>
</svg>
