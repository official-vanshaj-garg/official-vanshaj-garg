<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="140" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.08">
    <path d="M80 0V260" stroke="#94A3B8"/>
    <path d="M180 0V260" stroke="#94A3B8"/>
    <path d="M280 0V260" stroke="#94A3B8"/>
    <path d="M380 0V260" stroke="#94A3B8"/>
    <path d="M480 0V260" stroke="#94A3B8"/>
    <path d="M580 0V260" stroke="#94A3B8"/>
    <path d="M680 0V260" stroke="#94A3B8"/>
    <path d="M780 0V260" stroke="#94A3B8"/>
    <path d="M880 0V260" stroke="#94A3B8"/>
    <path d="M980 0V260" stroke="#94A3B8"/>
    <path d="M1080 0V260" stroke="#94A3B8"/>

    <path d="M0 60H1200" stroke="#94A3B8"/>
    <path d="M0 120H1200" stroke="#94A3B8"/>
    <path d="M0 180H1200" stroke="#94A3B8"/>
  </g>

  <!-- Accent line -->
  <rect x="72" y="56" width="72" height="4" rx="2" fill="url(#accent)" filter="url(#softGlow)"/>

  <!-- Small label -->
  <text x="72" y="42" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2">
    SOFTWARE ENGINEERING · APPLIED AI
  </text>

  <!-- Name -->
  <text x="72" y="122" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="700">
    Vanshaj
  </text>

  <!-- Subtitle -->
  <text x="72" y="158" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">
    SDE Intern · AI/ML Undergraduate · Backend + Applied AI Builder
  </text>

  <!-- Description -->
  <text x="72" y="198" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400">
    Building practical systems across APIs, automation, dashboards, and applied AI workflows.
  </text>

  <!-- Right side accent block -->
  <g opacity="0.9">
    <rect x="915" y="58" width="210" height="138" rx="18" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="955" cy="98" r="6" fill="#38BDF8"/>
    <circle cx="980" cy="98" r="6" fill="#8B5CF6"/>
    <circle cx="1005" cy="98" r="6" fill="#22C55E"/>

    <text x="948" y="132" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      Focus Areas
    </text>

    <text x="948" y="160" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">
      • Backend Engineering
    </text>
    <text x="948" y="182" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">
      • Applied AI Systems
    </text>
  </g>
</svg>
